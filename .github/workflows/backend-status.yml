name: Verify Neon production wiring
on:
  pull_request:
    branches: [main]
    paths:
      - 'ops/backend-status-trigger.txt'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check production backend flags
        run: |
          set -euo pipefail
          BODY=$(curl --fail --silent --show-error https://europa-2027.vercel.app/api/backend-status)
          echo "$BODY"
          echo "$BODY" | grep '"databaseUrl":true'
          echo "$BODY" | grep '"neonAuthBaseUrl":true'
          echo "$BODY" | grep '"neonDataApiUrl":true'
