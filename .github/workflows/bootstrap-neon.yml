name: Bootstrap Neon production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-neon.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ops/neon-bootstrap-trigger.txt'

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Apply production schema through Vercel
        shell: bash
        run: |
          set -euo pipefail
          URL="https://europa-2027.vercel.app/api/bootstrap-neon"
          for attempt in $(seq 1 20); do
            echo "Attempt ${attempt}/20"
            BODY=$(mktemp)
            CODE=$(curl --silent --show-error --location --output "$BODY" --write-out "%{http_code}" "$URL" || true)
            cat "$BODY"
            echo
            if [ "$CODE" = "200" ]; then
              echo "Neon bootstrap completed."
              exit 0
            fi
            echo "HTTP $CODE; waiting for production deployment/environment..."
            sleep 15
          done
          echo "Bootstrap did not complete after retries."
          exit 1
